spring.application.name=turf-booking

# MySQL connection. Set these as environment variables instead of hard-coding your password.
#   DB_USERNAME (default: root)   DB_PASSWORD (default: empty)
spring.datasource.url=jdbc:mysql://localhost:3306/turf_booking?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Creates/updates tables from the entity classes (fine for development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
